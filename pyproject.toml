[project]
name = "fakturama-image-to-cash"
version = "0.1.0"
description = "Image-to-cash automation for Fakturama"
readme = "README.md"
authors = [
    { name = "webmekanic", email = "aniebovictor001@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.2.0",
    "pillow>=12.3.0",
    "pywinauto>=0.6.9",
]

[project.scripts]
fakturama-image-to-cash = "fakturama_image_to_cash:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
